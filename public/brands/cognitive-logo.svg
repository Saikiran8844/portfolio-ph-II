<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#13091e" />
  <circle cx="100" cy="100" r="60" stroke="url(#ai-grad)" stroke-width="4" opacity="0.4" />
  <circle cx="100" cy="100" r="38" fill="url(#ai-grad)" opacity="0.25" />
  <!-- Neural Nodes -->
  <circle cx="100" cy="70" r="10" fill="#ec4899" />
  <circle cx="70" cy="115" r="9" fill="#8b5cf6" />
  <circle cx="130" cy="115" r="9" fill="#3b82f6" />
  <circle cx="100" cy="100" r="12" fill="#ffffff" />
  <!-- Synaptic Connections -->
  <line x1="100" y1="70" x2="100" y2="100" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  <line x1="70" y1="115" x2="100" y2="100" stroke="#8b5cf6" stroke-width="3" opacity="0.8" />
  <line x1="130" y1="115" x2="100" y2="100" stroke="#3b82f6" stroke-width="3" opacity="0.8" />
  <line x1="70" y1="115" x2="130" y2="115" stroke="url(#ai-grad)" stroke-width="2" opacity="0.5" stroke-dasharray="4 4" />
</svg>
